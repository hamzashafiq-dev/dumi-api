<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Layout</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5f5;
        }

        .table-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 120px;
            gap: 15px;
            width: 90%;
            max-width: 1200px;
            padding: 20px;
        }

        .table {
            background: lightgray;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Table spanning different sizes */
        .table.table-sm { grid-row: span 1; grid-column: span 1; }
        .table.table-md { grid-row: span 2; grid-column: span 1; }
        .table.table-lg { grid-row: span 3; grid-column: span 1; }
        .table.table-wide { grid-column: span 2; grid-row: span 1; }
        .table.table-tall { grid-row: span 2; grid-column: span 2; }

    </style>
</head>
<body>

    <div class="table-container">
        <div class="table table-sm">T1</div>
        <div class="table table-sm">T1</div>
        <div class="table table-sm">T1</div>
        <div class="table table-sm">T1</div>
        <div class="table table-md">T4</div>
        <div class="table table-wide">T4</div>
        <div class="table table-wide">T4</div>
        <div class="table table-lg">T4</div>
        <div class="table table-md">T4</div>
        <div class="table table-sm">T1</div>
        <div class="table table-sm">T1</div>
        <div class="table table-sm">T1</div>
        <div class="table table-tall">T4</div>
        <div class="table table-sm">T1</div>
        <div class="table table-sm">T1</div>
        <div class="table table-sm">T1</div>
    </div>

</body>
</html>
