<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag drop</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <br>
    <br>
    <br>
    
    <div class="boxed">

        <div class="form-input-group">
            <input class="form-input" type="text" placeholder="Enter Your Name">
            <label class="form-input-label">Lastname *</label>
        </div>
        
        <br>
        <br>
        <br>
        
        <div class="form-input-group">
            <input class="form-input form-password" type="password" placeholder="********">
            <label class="form-input-label">Password *</label>
        </div>

        <br>
        <br>

        <div class="form-input-group">
            <input class="form-input" type="email" placeholder="Enter Your Email">
            <label class="form-input-label">Email *</label>
            <i class="input-icon bx bx-envelope"></i>
        </div>

        <br>
        <br>
        
        <div class="form-input-group">
            <input class="form-input form-password" type="password" placeholder="********">
            <label class="form-input-label">Password *</label>
            <i class="input-icon bx bx-lock"></i>
        </div>

        <br>
        <div class="form-input-group validation-wrng">
            <input class="form-input form-password" type="password" placeholder="********">
            <label class="form-input-label">Password *</label>
            <i class="input-icon bx bx-lock"></i>
            <small class="incorrect">You entered wrong password</small>
        </div>
        <div class="form-button">
            <button class="form-btn">Save</button>
            <button class="form-btn form-btn-primary">Save</button>
            <button class="form-btn form-btn-hover">Save</button>
            <button class="form-btn form-btn-hover-primary">Save</button>
        </div>
    </div>

</body>

</html>
