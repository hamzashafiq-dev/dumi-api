<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<style>
    body {
        height: 100vh;
        background: rgba(238, 238, 238, 1);
        padding: 100px 0px;
    }

    .boxed {
        width: 30%;
    }
</style>

<body>

    <div class="boxed">
        <div class="card bucket-card">
            <div class="card-head">
                <div class="card-image">
                    <img src="../images/product-image.png" alt="Bucket product image" class="image">
                </div>
            </div>
            <div class="card-body">
                <div class="card-title">
                    Original Cheese Meat Burger With Chips (Non Veg)
                </div>
                <div class="qty-price">
                    <div class="qty">1x</div>
                    <div class="price text-primary">$24.99</div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
