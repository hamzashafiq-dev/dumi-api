<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Badge</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<style>
  body {
    height: 100vh;
    background: rgba(238, 238, 238, 1);
    padding: 100px 0px;
  }
</style>

<body>
  <div class="modal-overlay" id="paymentOverlay">
    <div class="modal payment-modal active" id="payment">
      <div class="modal-content">
        <div class="card payment-card">
          <div class="card-head">
            <div class="card-icon">
              <img src="../images/icon/check.png" alt="">
            </div>
            <div class="card-title">Payment Success!</div>
            <div class="price">$63.71</div>
          </div>
          <div class="card-body">
            <div class="d-flex">
              <div class="card-desc">
                Order ID
              </div>
              <div class="card-desc">
                5265662517
              </div>
            </div>
            <div class="d-flex">
              <div class="card-desc">
                Payment Method
              </div>
              <div class="card-desc">
                QR Code
              </div>
            </div>
            <div class="d-flex">
              <div class="card-desc">
                Payment Time
              </div>
              <div class="card-desc">
                06/11/23 10:45 PM
              </div>
            </div>
          </div>
          <div class="card-foot">
            <div class="button">
              <button class="btn btn-block btn-primary">New Order</button>
              <button class="btn btn-block print-btn"><i class='bx bx-printer'></i> Print Receipt</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button class="btn btn-primary btn-block" data-target="payment">Open Modal 2</button>


  <script src="../js/main.js"></script>

</body>

</html>
