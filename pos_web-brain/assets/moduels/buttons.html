<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<style>
    body {
        height: 100vh;
        background: rgba(238, 238, 238, 1);
        padding: 100px 0px;
    }

    button {
        margin-bottom: 20px;
    }
</style>

<body>
    <div class="boxed">
        <!-- <button class="btn btn-light btn-icon"><i class="bx bx-menu"></i></button>
        <br>
        <br>
        <br>
        <button class="btn btn-light btn-icon btn-image"><img src="../images/icon/filter.png" alt=""></button> -->

        <div style="padding: 20px;">
            <!-- Basic Buttons -->
            <button class="btn btn-primary">Primary</button>
            <button class="btn btn-secondary">Secondary</button>
            <button class="btn btn-success">Success</button>
            <button class="btn btn-info">Info</button>
            <button class="btn btn-warning">Warning</button>
            <button class="btn btn-danger">Danger</button>
            <button class="btn btn-light">Light</button>
            <button class="btn btn-dark">Dark</button>

            <!-- Disabled Button -->
            <button class="btn btn-primary" disabled>Disabled</button>

            <!-- Icon Buttons -->
            <button class="btn btn-primary btn-icon">
                <span class="icon-pre">🔍</span>
                Search
            </button>
            <button class="btn btn-secondary btn-icon">
                Download
                <span class="icon-post">⬇️</span>
            </button>

            <!-- Button Sizes -->
            <button class="btn btn-primary btn-sm">Small Button</button>
            <button class="btn btn-primary">Default Button</button>
            <button class="btn btn-primary btn-lg">Large Button</button>

            <!-- Pill Button -->
            <button class="btn btn-primary btn-pill">Pill Button</button>

            <!-- Full-width Button -->
            <button class="btn btn-primary btn-block">Full-width Button</button>
        </div>

    </div>
</body>

</html>
