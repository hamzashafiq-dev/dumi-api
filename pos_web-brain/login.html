<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pos" />
    <title>Login</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/libs/swiper/swiper.min.css" />
  </head>
  <body class="body-login">
    <div class="login-page">
      <div class="login-swiper">
        <div class="content">
          <div class="swiper swipe-login">
            <div class="swiper-wrapper">
              <div class="swiper-slide">
                <img
                  src="./assets/images/login/bussines-grow.png"
                  width="100px"
                  alt="login swiper image"
                />
                <h1>TimeTide</h1>
                <p>
                  It is a Time Tracker and instant Massenger on your desktop.
                </p>
              </div>
              <div class="swiper-slide">
                <img
                  src="./assets/images/login/in_zone.png"
                  width="100px"
                  alt="login swiper image"
                />
                <h1>TimeTide</h1>
                <p>
                  It is a Time Tracker and instant Massenger on your desktop.
                </p>
              </div>
              <div class="swiper-slide">
                <img
                  src="./assets/images/login/timeline.png"
                  width="100px"
                  alt="login swiper image"
                />
                <h1>TimeTide</h1>
                <p>
                  It is a Time Tracker and instant Massenger on your desktop.
                </p>
              </div>
            </div>
            <div class="swiper-pagination"></div>
          </div>
        </div>
      </div>
      <div class="login">
        <div class="login-content">
          <img src="./assets/images/logo-sm.png" alt="Logo" class="logo" />
          <h2>Enter Pin</h2>
          <p>Pin is required to enable Touch ID</p>

          <!-- PIN dots -->
          <div class="pin-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>

          <!-- Number pad -->
          <div class="numpad">
            <button class="btn btn-light" onclick="enterPin(1)">1</button>
            <button class="btn btn-light" onclick="enterPin(2)">2</button>
            <button class="btn btn-light" onclick="enterPin(3)">3</button>
            <button class="btn btn-light" onclick="enterPin(4)">4</button>
            <button class="btn btn-light" onclick="enterPin(5)">5</button>
            <button class="btn btn-light" onclick="enterPin(6)">6</button>
            <button class="btn btn-light" onclick="enterPin(7)">7</button>
            <button class="btn btn-light" onclick="enterPin(8)">8</button>
            <button class="btn btn-light" onclick="enterPin(9)">9</button>
            <button class="btn btn-light" onclick="clearAll()">C</button>
            <button class="btn btn-light" onclick="enterPin(0)">0</button>
            <button class="btn btn-light" onclick="deletePin()">
              <i class="bx bx-x"></i>
            </button>
          </div>

          <!-- Sign in button -->
          <button class="sign-in btn btn-primary" id="signInBtn" disabled>
            Sign In
          </button>
        </div>
      </div>
    </div>
    <script src="./assets/js/main.js"></script>
    <script src="./assets/libs/swiper/swiper.min.js"></script>
  </body>
</html>
